schema: spec-driven

rules:
  specs:
    - Заголовки схемы OpenSpec (Purpose, Requirement, Scenario, ADDED/MODIFIED/REMOVED Requirements) не переводить.
    - В каждое требование включи нормативное MUST (требование проверки OpenSpec). Остальной человекочитаемый текст - по-русски.
    - Запрещены сленг и англицизмы (smoke, E2E, pipeline, fail как ярлык) и имена типов, полей, кодов ошибок как основная ткань текста. Сначала что видит пользователь и что делает система.
  tasks:
    - Разбивай реализацию на законченные проверяемые срезы.
    - В каждом срезе предусматривай реализацию и проверки.
    - После завершения реализации и проверок добавляй итоговое ревью. После исправлений повторяй затронутые проверки и ревью.
    - Каждая задача должна быть чекбоксом формата `- [ ] X.Y ...` и содержать способ проверки завершения.
    - По завершении и проверке каждого пункта задачи агент обязан сразу закрыть его (`- [x]`) в `tasks.md` и закоммитить изменения с помощью навыка `commit` (`/agents/skills/commit/SKILL.md`).
    - При работе с требованиями или задачами в `openspec/changes/<change-name>/` вести журнал `memory.md` с помощью навыка `openspec-memory` (`/agents/openspec/skills/memory/SKILL.md`).
